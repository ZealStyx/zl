name: Phase 16 Boundary Checks

on:
  push:
  pull_request:

jobs:
  phase16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run Phase 16 valid cases
        run: |
          set -e
          for f in examples/valid/phase16_collection_tests/*.zl examples/valid/phase16_library_tests/*.zl; do
            ./build/zl_language "$f"
          done
      - name: Run Phase 16 invalid cases
        run: |
          set -e
          for f in examples/invalid/phase16_library_tests/*.zl; do
            if ./build/zl_language "$f"; then
              echo "Expected failure: $f"
              exit 1
            fi
          done
