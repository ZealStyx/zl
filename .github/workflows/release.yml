name: ZL Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            generator: TGZ
          - os: windows-latest
            generator: ZIP
          - os: macos-latest
            generator: TGZ
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Install tree
        run: cmake --install build --prefix install
      - name: Package
        run: cpack --config build/CPackConfig.cmake -G ${{ matrix.generator }} -B release
      - name: Smoke test runtime
        shell: bash
        run: |
          test -x install/bin/zl || test -x install/bin/zl_language || exit 1
          install/bin/zl --version 2>/dev/null || install/bin/zl_language --version
      - uses: actions/upload-artifact@v4
        with:
          name: zl-${{ runner.os }}-${{ github.ref_name }}
          path: release/*
