  windows:
    name: Windows - build and CTest
    runs-on: windows-latest
    # MSVC needs roughly three times the wall clock of the Linux job for the
    # same zl-tests target: several of the 36 executables each compile the
    # whole runtime source set, and there is no ccache on the runner. 30
    # minutes was not enough to finish the build, which reads as a hang.
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

